[brand]
id            = "usurance"
display_name  = "Usurance"
tagline       = "Usurance identity wallet"
manufacturer  = "Usurance"

[identity]
bundle_id       = "com.usurance.wallet"
# New, brand-unique Windows upgrade code (must differ from Locksmith's).
upgrade_code    = "366AED70-0781-4108-86F8-F92975EBF7CA"
data_dir        = "Usurance"
artifact_prefix = "Usurance"
org_domain      = "usurance.com"

[urls]
website         = "https://usurance.com"
support         = "https://usurance.com/support"
# Same publisher (keri.host) + CDN, brand-namespaced feed so a Usurance install
# checks its own appcast rather than Locksmith's.
appcast_macos       = "https://releases.keri.host/usurance/appcast/v1/macos.json"
appcast_windows     = "https://releases.keri.host/usurance/appcast/v1/windows.json"
appcast_macos_xml   = "https://releases.keri.host/usurance/appcast/v1/macos.xml"
appcast_windows_xml = "https://releases.keri.host/usurance/appcast/v1/windows.xml"

# Theme from the Usurance design system (~/code/usurance/spec/suite/design-system.md):
# Teal 600 is the primary interactive color (buttons/links/CTA); Teal 700 the
# hover/pressed; dark surfaces are the design system's Gray 900/950 family.
[theme]
primary         = "#2AABB3"
primary_hover   = "#1E8E95"
primary_pressed = "#17838A"
toolbar_dark    = "#1A202C"

[org]
name = "Usurance"

# Logo variants derived from ~/code/usafe/.../UsuranceLogo.svg (blue gradient
# lockup). The color logo is reused for the *Black variants for now — refine
# with true monochrome/symbol-only marks later. Rasters are generated from the
# SVG (splash + app icon).
[assets]
app_icon_icns     = "AppIcon.icns"
app_icon_ico      = "AppIcon.ico"
splash            = "SplashScreen.png"
# Treatments: standard (color) / white (reversed, dark surfaces) / black
# (mono-dark, light surfaces). The white + black symbols are the wordless
# eye+globe, tightly cropped/centered, single flat color (no gradient),
# derived from UsuranceLogo.svg — the color lockup goes muddy at favicon size.
symbol_logo       = "SymbolLogo.svg"
symbol_logo_white = "SymbolLogoWhite.svg"
symbol_logo_black = "SymbolLogoBlack.svg"
name_logo         = "NameLogo.svg"
name_logo_black   = "NameLogoBlack.svg"
full_logo         = "FullLogo.svg"
full_logo_black   = "FullLogoBlack.svg"

# App-icon squircle plate color (build-appicon.py). Solid white behind the teal
# eye+globe symbol — the color lockup on transparency goes faint on a dark dock.
# NOT under [assets] (check-brand-complete treats every [assets] value as a
# file). Locksmith omits this and uses the default cream gradient.
[icon]
plate = "#FFFFFF"

# Same publisher as Locksmith: Usurance reuses the shared keri.host publisher
# trust anchor + deploy config, build-injected exactly like Locksmith (not
# shipped in this brand dir). No separate Usurance publisher AID.
[publisher]
anchor        = "publisher_anchor.json"
deploy_config = "deploy_config.json"

# HOA first-run bootstrap defaults (locksmith-hoa-base scaffold): drives the
# Task 5/9 auto-created vault + AID on first launch, and the wallet-page peel.
# Witnessless POC per backlog — real witness defaults land later.
[bootstrap]
peel_core_pages    = true
default_vault_name = "Default"
default_passcode   = ""          # unencrypted for POC; owner may set a default later
default_aid_alias  = "default"
default_witnesses  = []          # witnessless POC (backlog witness defaults)
default_toad       = 0

# Bundled-only in-tree plugins this brand activates (HOA #4): which surfaces a
# brand composes is brand config, never a framework hardcode. The usurance
# brand is the multi-role internal-roles HOA (actuary + product designer);
# the carrier example is retired to tests/fixtures/carrier_egf_bundle/.
[plugins]
bundled = ["hoa_shell", "actuary", "product_designer"]

# Ecosystem Governance Framework this brand pins (bundled verbatim,
# content-addressed, under brands/usurance/egf/ — see
# docs/superpowers/specs/... EGF substrate design). document_said is the
# EGF doc's own SAID (its filename minus .json); pinning it here — not
# deriving it at runtime — is the whole point of content addressing: any
# drift between this value and the bundled doc's re-derived SAID is a bug,
# caught by tests/core/test_usurance_egf_bundle.py.
[egf]
source = "local"
document_said = "EPyySfoR14je2B0cxb5xL0Ep9pf7qRcUrd3zAUY3iuF-"
accept_phases = ["production"]   # usurance-admin is a genuine production authority

# HOA onboarding flow (workspace setup + credential request) is exposed for
# this brand's first-run experience.
[onboarding]
enabled = true

# Direct-peer transport. `advertised_host` overrides what this wallet tells
# peers to dial (locksmith.peer.netaddr). Leave it unset — the default is to
# auto-detect the address of the interface that owns the default route, which
# also returns the overlay address once a VPN/Tailscale interface carries that
# route. Pin it ONLY when a host has both a LAN and an overlay address and the
# wrong one wins; a per-install override is $LOCKSMITH_ADVERTISED_HOST.
# [peer]
# advertised_host = ""
