name: Release Build
on:
  release:
    types: [created]

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        brand: [locksmith, usurance]
    permissions:
      id-token: write   # required for GitHub Actions OIDC
      contents: read
    env:
      LOCKSMITH_BRAND: ${{ matrix.brand }}
      LOCKSMITH_RELEASE_CHANNEL: stable
      AWS_REGION: us-east-1
      S3_BUCKET: releases.keri.host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full clone so `git verify-tag` in the preflight has the
          # signed-tag object. `fetch-tags: true` collides with the
          # release event's pre-fetched ref; `fetch-depth: 0` does not.
          fetch-depth: 0

      - name: Re-fetch annotated tag object
        # actions/checkout on a `release` event writes refs/tags/<tag>
        # as a lightweight ref pointing at the commit, even with
        # fetch-depth: 0. That makes `git verify-tag` fail with
        # "non-tag object of type commit". Force-fetch overwrites the
        # ref with the real annotated tag object from origin.
        run: git fetch --tags --force origin

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup virtual environment outside of repo
        run: |
          python -m venv /tmp/venv
          source /tmp/venv/bin/activate
          echo "VIRTUAL_ENV=/tmp/venv" >> $GITHUB_ENV
          echo "/tmp/venv/bin" >> $GITHUB_PATH

      - name: Install requirements (with build-macos extras)
        run: |
          source /tmp/venv/bin/activate
          pip install --upgrade pip setuptools wheel boto3 pyyaml
          pip install -e .[build-macos]

      - name: Resolve brand identity into env
        run: |
          source /tmp/venv/bin/activate
          BID="$(cd packaging && python -m brandlib id bundle_id)"
          echo "APP_ID=$BID" >> $GITHUB_ENV
          echo "KC_PROFILE=$BID" >> $GITHUB_ENV

      - name: Configure git to verify SSH-signed tags via .gitsigners
        run: |
          git config --global gpg.format ssh
          git config --global gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.gitsigners"

      - name: Preflight — verify tag matches pyproject and is signed
        run: |
          source /tmp/venv/bin/activate
          python scripts/check-version.py --tag "${{ github.event.release.tag_name }}"

      - name: Set version output
        id: set_version
        run: |
          version="${{ github.event.release.tag_name }}"
          if [[ "$version" == v* ]]; then version="${version:1}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve artifact prefix
        id: prefix
        shell: bash
        run: |
          source /tmp/venv/bin/activate 2>/dev/null || true
          echo "value=$(cd packaging && python -m brandlib id artifact_prefix)" >> "$GITHUB_OUTPUT"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Fetch Sparkle framework
        # Bundle Sparkle 2.x into the .app at build time. Pinned to the
        # 2.6.x line — pre-2.7 is what packaging/Locksmith.macos.spec was
        # authored against. Lands at packaging/macos/Sparkle.framework/
        # which the spec adds to Contents/Frameworks/.
        env:
          SPARKLE_VERSION: "2.6.4"
        run: |
          set -euo pipefail
          mkdir -p packaging/macos
          url="https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "fetching $url"
          curl -fsSL "$url" -o /tmp/sparkle.tar.xz
          tar -xf /tmp/sparkle.tar.xz -C /tmp
          # The tarball lays out Sparkle.framework directly at the top.
          if [ ! -d /tmp/Sparkle.framework ]; then
            echo "::error::Sparkle.framework not found after extracting tarball"
            ls -la /tmp >&2
            exit 1
          fi
          rm -rf packaging/macos/Sparkle.framework
          mv /tmp/Sparkle.framework packaging/macos/
          ls -la packaging/macos/Sparkle.framework/ | head -5

      - name: Import Apple Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain \
              -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Store notarytool credentials
        env:
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
        run: |
          echo "$API_KEY_CONTENT" > /tmp/api_key.p8
          xcrun notarytool store-credentials "$KC_PROFILE" \
              --key /tmp/api_key.p8 \
              --key-id "$API_KEY_ID" \
              --issuer "$API_KEY_ISSUER"
          rm /tmp/api_key.p8

      - name: Export signing identity into env
        env:
          DEVELOPER_ID_APP_CERT: ${{ secrets.DEVELOPER_ID_APP_CERT }}
        run: |
          echo "DEVELOPER_ID_APP_CERT=$DEVELOPER_ID_APP_CERT" >> $GITHUB_ENV

      - name: Inject shared trust material (both brands use the keri.host publisher)
        shell: bash
        env:
          PUBLISHER_ANCHOR: ${{ secrets.LOCKSMITH_PUBLISHER_ANCHOR }}
          DEPLOY_CONFIG: ${{ secrets.LOCKSMITH_DEPLOY_CONFIG }}
        run: |
          # check-brand-complete + brand_apply read brands/<brand>/publisher_anchor.json;
          # write the shared anchor there (gitignored) so the gate passes and
          # brand_apply copies BOTH into the brand's release dir. Write deploy_config
          # to brands/<brand>/ too (symmetric with the anchor) — otherwise for a
          # non-default brand whose release dir is release/<brand>/ (e.g. usurance),
          # a flat release/deploy_config.json is never staged into the bundle.
          mkdir -p "brands/${LOCKSMITH_BRAND}" src/locksmith/release
          printf '%s' "$PUBLISHER_ANCHOR" > "brands/${LOCKSMITH_BRAND}/publisher_anchor.json"
          printf '%s' "$DEPLOY_CONFIG"    > "brands/${LOCKSMITH_BRAND}/deploy_config.json"
          python -c "import json; json.load(open('brands/${LOCKSMITH_BRAND}/deploy_config.json')); print('deploy_config OK')" \
            || { echo '::error::LOCKSMITH_DEPLOY_CONFIG missing or invalid JSON'; exit 1; }

      - name: Apply brand (stages assets, brand.json, resources_rc, wix/dmg, trust)
        shell: bash
        run: |
          source /tmp/venv/bin/activate 2>/dev/null || true
          python scripts/brand_apply.py --brand "$LOCKSMITH_BRAND"
          python scripts/check-brand-complete.py --brand "$LOCKSMITH_BRAND"
          python scripts/check-anchor-present.py --anchor "brands/${LOCKSMITH_BRAND}/publisher_anchor.json"

      - name: Build, sign, notarize, staple DMG
        env:
          LOCKSMITH_RELEASE_CHANNEL: ${{ env.LOCKSMITH_RELEASE_CHANNEL }}
        run: |
          source /tmp/venv/bin/activate
          chmod +x packaging/build-macos.sh
          packaging/build-macos.sh

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gha-locksmith-release-publisher
          aws-region: ${{ env.AWS_REGION }}

      # Object-key convention: locksmith → releases/<ver>/…  (back-compatible)
      # all other brands → <brand>/releases/<ver>/…
      # The prefix here MUST match the appcast artifact base in each brand's
      # deploy_config.json — maintainer must confirm before the first real cut
      # for any new brand.
      - name: Resolve S3 key prefix for brand
        id: s3prefix
        shell: bash
        run: |
          # Single source of truth: brandlib computes the per-brand prefix
          # (locksmith -> releases; else <brand>/releases). Keep in sync with
          # the off-CI publisher, which calls the same brandlib id.
          source /tmp/venv/bin/activate 2>/dev/null || true
          echo "value=$(cd packaging && python -m brandlib id release_prefix)" >> "$GITHUB_OUTPUT"

      - name: Upload DMG to s3://releases.keri.host/<s3prefix>/<version>/
        run: |
          source /tmp/venv/bin/activate
          VERSION="${{ steps.set_version.outputs.version }}"
          python scripts/upload.py \
            --bucket "$S3_BUCKET" \
            --object-key "${{ steps.s3prefix.outputs.value }}/${VERSION}/${{ steps.prefix.outputs.value }}-${VERSION}.dmg" \
            --file "dist/${{ steps.prefix.outputs.value }}-${VERSION}.dmg" \
            --content-type application/x-apple-diskimage

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        brand: [locksmith, usurance]
    # `windows-signing` GitHub Environment gates this job on the tag glob v*
    # and supplies the AZURE_* + ARTIFACT_SIGNING_* variables consumed by
    # the azure/login and trusted-signing steps below.
    environment: windows-signing
    permissions:
      id-token: write   # required for GitHub Actions OIDC (AWS + Azure)
      contents: read
    env:
      LOCKSMITH_BRAND: ${{ matrix.brand }}
      LOCKSMITH_RELEASE_CHANNEL: stable
      AWS_REGION: us-east-1
      S3_BUCKET: releases.keri.host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full clone so `git verify-tag` in the preflight has the
          # signed-tag object. See Phase 2 macOS job for the gotcha.
          fetch-depth: 0

      - name: Re-fetch annotated tag object
        # actions/checkout on a `release` event writes refs/tags/<tag>
        # as a lightweight ref. Force-fetch overwrites with the real
        # annotated tag so `git verify-tag` succeeds.
        shell: bash
        run: git fetch --tags --force origin

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel boto3
          pip install -e .[build-windows]

      - name: Configure git to verify SSH-signed tags via .gitsigners
        shell: bash
        run: |
          git config --global gpg.format ssh
          git config --global gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.gitsigners"

      - name: Preflight — verify tag matches pyproject and is signed
        shell: bash
        run: |
          python scripts/check-version.py --tag "${{ github.event.release.tag_name }}"

      - name: Set version output
        id: set_version
        shell: bash
        run: |
          version="${{ github.event.release.tag_name }}"
          if [[ "$version" == v* ]]; then version="${version:1}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve artifact prefix
        id: prefix
        shell: bash
        run: |
          echo "value=$(cd packaging && python -m brandlib id artifact_prefix)" >> "$GITHUB_OUTPUT"
          # display_name is the PyInstaller output dir (dist/<display_name>) that
          # the trusted-signing step below points its files-folder at — brand-derived
          # so the usurance leg signs dist/Usurance, not the (absent) dist/Locksmith.
          echo "app_name=$(cd packaging && python -m brandlib id display_name)" >> "$GITHUB_OUTPUT"

      - name: Install libsodium (download MSVC build from jedisct1/libsodium)
        shell: pwsh
        run: |
          $version = "1.0.20"
          $url = "https://github.com/jedisct1/libsodium/releases/download/${version}-RELEASE/libsodium-${version}-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP "libsodium-msvc.zip"
          $extract = Join-Path $env:RUNNER_TEMP "libsodium-msvc"
          Write-Host "[install] downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          # Layout inside the zip:
          #   libsodium/x64/Release/v143/dynamic/libsodium.dll  (and .lib/.exp)
          # We want the x64 Release dynamic DLL.
          $candidates = Get-ChildItem -Recurse -Filter libsodium.dll -Path $extract |
            Where-Object { $_.FullName -match "x64" -and $_.FullName -match "[Rr]elease" -and $_.FullName -match "dynamic" }
          if (-not $candidates) {
            Write-Host "[install] no x64 Release dynamic match; tree dump:"
            Get-ChildItem -Recurse -Path $extract | Select-Object FullName
            throw "could not locate libsodium.dll inside $extract"
          }
          $dll = $candidates[0].FullName
          Write-Host "[install] libsodium.dll at $dll"
          New-Item -ItemType Directory -Force -Path "packaging/windows" | Out-Null
          Copy-Item -LiteralPath $dll -Destination "packaging/windows/libsodium.dll" -Force
          Get-Item "packaging/windows/libsodium.dll" | Select-Object FullName,Length

      - name: Fetch WinSparkle
        # Bundle WinSparkle 0.8.x next to Locksmith.exe at build time.
        # The spec's bindings under locksmith.update.winsparkle_bridge load
        # WinSparkle.dll via ctypes at runtime.
        shell: pwsh
        env:
          WINSPARKLE_VERSION: "0.8.3"
        run: |
          $url = "https://github.com/vslavik/winsparkle/releases/download/v${env:WINSPARKLE_VERSION}/WinSparkle-${env:WINSPARKLE_VERSION}.zip"
          $zip = Join-Path $env:RUNNER_TEMP "winsparkle.zip"
          $extract = Join-Path $env:RUNNER_TEMP "winsparkle"
          Write-Host "[install] downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          # WinSparkle.dll lives at WinSparkle-X.Y.Z/x64/Release/WinSparkle.dll
          $candidates = Get-ChildItem -Recurse -Filter WinSparkle.dll -Path $extract |
            Where-Object { $_.FullName -match "x64" -and $_.FullName -match "[Rr]elease" }
          if (-not $candidates) {
            Write-Host "[install] no x64 Release match; tree dump:"
            Get-ChildItem -Recurse -Path $extract | Select-Object FullName
            throw "could not locate WinSparkle.dll inside $extract"
          }
          $dll = $candidates[0].FullName
          Write-Host "[install] WinSparkle.dll at $dll"
          New-Item -ItemType Directory -Force -Path "packaging/windows/winsparkle" | Out-Null
          Copy-Item -LiteralPath $dll -Destination "packaging/windows/winsparkle/WinSparkle.dll" -Force
          Get-Item "packaging/windows/winsparkle/WinSparkle.dll" | Select-Object FullName,Length

      - name: Install WiX Toolset v4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          & wix --version

      - name: Install WiX UI extension
        shell: pwsh
        run: |
          & wix extension add -g WixToolset.UI.wixext/4.0.5
          & wix extension list -g

      # ---- Phase 3B: signing ------------------------------------------------
      # PyInstaller runs first; the produced .exe + .dll + .pyd files are
      # Authenticode-signed by Azure Artifact Signing; then WiX wraps the
      # signed tree into an MSI; then the MSI itself is signed. Two distinct
      # azure/trusted-signing-action calls (one per artifact set).

      - name: Inject shared trust material (both brands use the keri.host publisher)
        shell: bash
        env:
          PUBLISHER_ANCHOR: ${{ secrets.LOCKSMITH_PUBLISHER_ANCHOR }}
          DEPLOY_CONFIG: ${{ secrets.LOCKSMITH_DEPLOY_CONFIG }}
        run: |
          # check-brand-complete + brand_apply read brands/<brand>/publisher_anchor.json;
          # write the shared anchor there (gitignored) so the gate passes and
          # brand_apply copies BOTH into the brand's release dir. Write deploy_config
          # to brands/<brand>/ too (symmetric with the anchor) — otherwise for a
          # non-default brand whose release dir is release/<brand>/ (e.g. usurance),
          # a flat release/deploy_config.json is never staged into the bundle.
          mkdir -p "brands/${LOCKSMITH_BRAND}" src/locksmith/release
          printf '%s' "$PUBLISHER_ANCHOR" > "brands/${LOCKSMITH_BRAND}/publisher_anchor.json"
          printf '%s' "$DEPLOY_CONFIG"    > "brands/${LOCKSMITH_BRAND}/deploy_config.json"
          python -c "import json; json.load(open('brands/${LOCKSMITH_BRAND}/deploy_config.json')); print('deploy_config OK')" \
            || { echo '::error::LOCKSMITH_DEPLOY_CONFIG missing or invalid JSON'; exit 1; }

      - name: Apply brand (stages assets, brand.json, resources_rc, wix/dmg, trust)
        shell: bash
        run: |
          python scripts/brand_apply.py --brand "$LOCKSMITH_BRAND"
          python scripts/check-brand-complete.py --brand "$LOCKSMITH_BRAND"
          python scripts/check-anchor-present.py --anchor "brands/${LOCKSMITH_BRAND}/publisher_anchor.json"

      - name: Build .exe (PyInstaller stage)
        shell: pwsh
        env:
          LOCKSMITH_RELEASE_CHANNEL: ${{ env.LOCKSMITH_RELEASE_CHANNEL }}
        run: |
          pwsh packaging/build-windows.ps1 `
            -Version "${{ steps.set_version.outputs.version }}" `
            -Stage pyinstaller

      - name: Azure login via GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign PyInstaller binaries (Locksmith.exe + bundled DLLs / PYDs)
        uses: azure/trusted-signing-action@v0.5.1
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERT_PROFILE }}
          files-folder: dist/${{ steps.prefix.outputs.app_name }}
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build .msi (WiX stage, packages the now-signed binaries)
        shell: pwsh
        env:
          LOCKSMITH_RELEASE_CHANNEL: ${{ env.LOCKSMITH_RELEASE_CHANNEL }}
        run: |
          pwsh packaging/build-windows.ps1 `
            -Version "${{ steps.set_version.outputs.version }}" `
            -Stage msi

      - name: Sign the MSI itself
        uses: azure/trusted-signing-action@v0.5.1
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERT_PROFILE }}
          files-folder: build/windows
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gha-locksmith-release-publisher
          aws-region: ${{ env.AWS_REGION }}

      # Object-key convention: locksmith → releases/<ver>/…  (back-compatible)
      # all other brands → <brand>/releases/<ver>/…
      # The prefix here MUST match the appcast artifact base in each brand's
      # deploy_config.json — maintainer must confirm before the first real cut
      # for any new brand.
      - name: Resolve S3 key prefix for brand
        id: s3prefix
        shell: bash
        run: |
          # Single source of truth: brandlib computes the per-brand prefix
          # (locksmith -> releases; else <brand>/releases). Keep in sync with
          # the off-CI publisher, which calls the same brandlib id.
          echo "value=$(cd packaging && python -m brandlib id release_prefix)" >> "$GITHUB_OUTPUT"

      - name: Upload MSI to s3://releases.keri.host/<s3prefix>/<version>/
        shell: bash
        env:
          VERSION: ${{ steps.set_version.outputs.version }}
          PREFIX: ${{ steps.prefix.outputs.value }}
          S3_BUCKET: ${{ env.S3_BUCKET }}
        run: |
          MSI="build/windows/${PREFIX}-${VERSION}.msi"
          if [ ! -f "$MSI" ]; then
            echo "MSI not found at $MSI" >&2
            exit 1
          fi
          python scripts/upload.py \
            --bucket "$S3_BUCKET" \
            --object-key "${{ steps.s3prefix.outputs.value }}/${VERSION}/${PREFIX}-${VERSION}.msi" \
            --file "$MSI" \
            --content-type application/x-msi

      - name: Capture MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prefix.outputs.value }}-${{ steps.set_version.outputs.version }}-msi
          path: build/windows/${{ steps.prefix.outputs.value }}-${{ steps.set_version.outputs.version }}.msi
          retention-days: 7
