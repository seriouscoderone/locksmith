[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keri-assistant"
version = "0.0.1"
description = "UI-agnostic KERI-native assistant harness (Phase 0/1 core)"
requires-python = ">=3.14"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/keri_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
