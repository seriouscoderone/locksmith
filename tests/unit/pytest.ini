[pytest]
# Tests under tests/unit/ load keripy via tools/publisher and locksmith, both
# of which transitively import apispec → packaging.version. The repo's
# packaging/ namespace directory (used by Phase 2/3 build-script tests) can
# shadow the PyPI distribution depending on import order. Using importlib
# mode here keeps packaging.version resolvable. See
# [[reference_test_env_importlib]].
addopts = --import-mode=importlib
pythonpath = ../../src ../..
testpaths = .
