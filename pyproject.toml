# pyproject.toml

[build-system]

requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Locksmith"
version = "0.2.21"
description = "Locksmith – KERI identity vault application"
readme = "README.md"
requires-python = ">=3.14.0"
license = { text = "MIT" }

authors = [
    { name = "Phillip Feairheller", email = "pfeairheller@gmail.com" },
    { name = "Ari Argoud", email = "ariargoud@gmail.com" },
    { name = "Evan Asakawa", email = "evanja57@gmail.com" }
]

keywords = ["KERI Foundation", "cryptography", "KERI", "ACDC"]

classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "PySide6==6.10.3",
    "qasync>=0.28.0",
    # Fork (not upstream WebOfTrust) until the `wss` loc scheme lands upstream: the serverless
    # mailbox client (keri-serverless-mailbox) needs Schemes.wss to discover + select the WS
    # notify-and-fetch strategy; without it discovery degrades to SSE polling. Revert to the
    # WebOfTrust pin once the wss PR merges + a keri release carries it.
    "keri @ git+https://github.com/seriouscoderone/keripy.git@development",
    "qtawesome>=1.4.0",
    "mnemonic==0.21",
    "multicommand==1.0.0",
    "pillow==12.2.0",
    "qrcode[pil]==8.2",
    "pyotp==2.9.0",
    "prometheus_client>=0.21.1",
    "schedule==1.2.2",
    "kerkle>=0.0.3",
    "cbor>=1.0.0",
    "falcon==4.2.0",
    "requests==2.32.3",
    "certifi>=2024.2.2",  # explicit: the update verify path uses certifi's CA bundle (frozen-app TLS)
    'cryptography>=46.0.3',
    'pymongo>=4.11.2',
    # Git-only (not published to PyPI): the serverless mailbox client lives in its
    # own public repo. Pin like `keri` above so CI/packaged builds can install it;
    # its transitive bare `keri` is satisfied by the top-level fork pin.
    # Pinned to an exact commit (not @main) so a moving main can't drop the
    # DbTopsCursorStore export locksmith imports (core/mailbox_cursor.py) —
    # bump this hash deliberately when adopting newer mailbox-lib changes.
    "keri-serverless-mailbox @ git+https://github.com/usuranceai/keri-serverless-mailbox.git@f98cec69eac7aa600ededca1328e2572241eeef0",
]

[project.optional-dependencies]
build-macos = [
    "pyinstaller>=6.6,<7",
    "dmgbuild>=1.6.1",
    # Phase 5 Sparkle bridge — PyObjC talks to the bundled Sparkle.framework
    # at runtime via objc.lookUpClass("SPUUpdater"), so no third-party
    # framework binding is needed. Cocoa wrapper covers NSObject + the
    # delegate-protocol plumbing. (There is no pyobjc-framework-Sparkle on
    # PyPI; Sparkle is third-party and not part of PyObjC's umbrella.)
    "pyobjc-framework-Cocoa>=10.3 ; sys_platform == 'darwin'",
]
build-windows = [
    "pyinstaller>=6.6,<7",
]

[project.entry-points."locksmith.plugins"]
kerifoundation = "locksmith.plugins.kerifoundation.plugin:KeriFoundationPlugin"
carrier = "locksmith.plugins.carrier.plugin:CarrierPlugin"


[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
    "integration: integration tests that spawn real wallet subprocesses (slow; opt-in)",
    "network: tests that require an outbound network connection",
]
