# pyproject.toml

[build-system]

requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Locksmith"
version = "0.3.6"
description = "Locksmith – KERI identity vault application"
readme = "README.md"
requires-python = ">=3.14.0"
license = { text = "MIT" }

authors = [
    { name = "Phillip Feairheller", email = "pfeairheller@gmail.com" },
    { name = "Ari Argoud", email = "ariargoud@gmail.com" },
    { name = "Evan Asakawa", email = "evanja57@gmail.com" }
]

keywords = ["KERI Foundation", "cryptography", "KERI", "ACDC"]

classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "PySide6==6.10.3",
    "qasync>=0.28.0",
    # Fork (not upstream WebOfTrust) until the `wss` loc scheme lands upstream: the serverless
    # mailbox client (keri-serverless-mailbox) needs Schemes.wss to discover + select the WS
    # notify-and-fetch strategy; without it discovery degrades to SSE polling. Revert to the
    # WebOfTrust pin once the wss PR merges + a keri release carries it.
    # Pinned to an exact commit (not the moving @development) for reproducible
    # builds — this is the keri.host keripy fork. NOTE: keri.__version__ MUST stay
    # "2.0.0-dev6" — keri gates DB open on `db.version == __version__` (basing.py
    # Baser.current), so relabeling it bricks every existing keystore/vault. The
    # fork identity is surfaced Locksmith-side (build_info.KERIPY_COMMIT), not by
    # editing keri's version.
    "keri @ git+https://github.com/seriouscoderone/keripy.git@dc88ea0d1b7c310341242f679cc1c498b07cac4e",
    "qtawesome>=1.4.0",
    "mnemonic==0.21",
    "multicommand==1.0.0",
    "pillow==12.2.0",
    "qrcode[pil]==8.2",
    "pyotp==2.9.0",
    "prometheus_client>=0.21.1",
    "schedule==1.2.2",
    "kerkle>=0.0.3",
    "cbor>=1.0.0",
    "falcon==4.2.0",
    "requests==2.32.3",
    "certifi>=2024.2.2",  # explicit: the update verify path uses certifi's CA bundle (frozen-app TLS)
    'cryptography>=46.0.3',
    'pymongo>=4.11.2',
    # Git-only (not published to PyPI): the serverless mailbox client lives in its
    # own public repo. Pin like `keri` above so CI/packaged builds can install it;
    # its transitive bare `keri` is satisfied by the top-level fork pin.
    # Pinned to an exact commit (not @main) so a moving main can't drop the
    # DbTopsCursorStore export locksmith imports (core/mailbox_cursor.py) —
    # bump this hash deliberately when adopting newer mailbox-lib changes.
    "keri-serverless-mailbox @ git+https://github.com/usuranceai/keri-serverless-mailbox.git@f98cec69eac7aa600ededca1328e2572241eeef0",
    # Generative agent-avatar library (the "presence orb"), extracted from this
    # repo into its own package. Pure-Python core; the widget/audio it uses run
    # on the PySide6 already pinned above. Pin to a release tag so CI/packaged
    # builds are reproducible; bump deliberately when adopting a new avatar
    # version (a new ALGO_VERSION never changes existing agents' avatars).
    "ai-identicon @ git+https://github.com/seriouscoderone/ai-identicon.git@v0.5.0",
]

[project.optional-dependencies]
# Dev/test toolchain. Install with `pip install -e .[test]` (see CLAUDE.md ›
# Running tests). `pytest-qt` provides the `qtbot` fixture used by the update
# scheduler tests. `click`/`fido2`/`boto3` are the publisher's runtime deps:
# tests/integration/test_publisher_roundtrip.py bootstraps tools/publisher/src
# onto sys.path at runtime (it does NOT `pip install -e tools/publisher`, which
# would pull that sub-package's unpinned upstream `keri` and conflict with the
# fork pinned above), so those deps must be present here as plain packages.
test = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "click>=8.1",
    "fido2>=1.1",
    "boto3>=1.34",
    # `ruff` is a TEST dependency, not a style tool: tests/test_undefined_names.py
    # runs `ruff check --select F821` over src/, which is the only thing in this
    # repo that can see a name used but never bound. That defect shipped once
    # (42fcfcb4) and cost a session — a NameError on a rarely-taken branch is
    # invisible to a suite that never takes it.
    "ruff>=0.5",
]
build-macos = [
    "pyinstaller>=6.6,<7",
    "dmgbuild>=1.6.1",
    # Phase 5 Sparkle bridge — PyObjC talks to the bundled Sparkle.framework
    # at runtime via objc.lookUpClass("SPUUpdater"), so no third-party
    # framework binding is needed. Cocoa wrapper covers NSObject + the
    # delegate-protocol plumbing. (There is no pyobjc-framework-Sparkle on
    # PyPI; Sparkle is third-party and not part of PyObjC's umbrella.)
    "pyobjc-framework-Cocoa>=10.3 ; sys_platform == 'darwin'",
]
build-windows = [
    "pyinstaller>=6.6,<7",
]

# Default-on in-tree plugins: discovered for every brand (an HOA peel can still
# remove one — see activation_policy.HOA_PEELED_PLUGIN_IDS).
[project.entry-points."locksmith.plugins"]
kerifoundation = "locksmith.plugins.kerifoundation.plugin:KeriFoundationPlugin"

# Brand-COMPOSED in-tree plugins: discovered only when the active brand lists the
# plugin under `[plugins] bundled` in its brand.toml. The group carries that
# policy because it must be decidable BEFORE the module is imported, and it keeps
# the framework from hardcoding plugin ids (it replaces the old
# BUNDLED_ONLY_PLUGIN_IDS frozenset). Both groups live under locksmith.plugins,
# so the specs' collect_submodules("locksmith.plugins") covers them unchanged.
[project.entry-points."locksmith.plugins.composed"]
carrier = "locksmith.plugins.carrier.plugin:CarrierPlugin"
hoa_shell = "locksmith.plugins.hoa_shell.plugin:HoaShellPlugin"
actuary = "locksmith.plugins.actuary.plugin:ActuaryPlugin"
product_designer = "locksmith.plugins.product_designer.plugin:ProductDesignerPlugin"
cuo = "locksmith.plugins.cuo.plugin:CuoPlugin"


[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
    "integration: integration tests that spawn real wallet subprocesses (slow; opt-in)",
    "network: tests that require an outbound network connection",
]
